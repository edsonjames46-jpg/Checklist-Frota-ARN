<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist de Frota - App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 26px;
        color: #0057d9;
        margin-bottom: 10px;
        text-align: center;
      }

      .app-card {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 20px;
        border-radius: 18px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      label {
        font-weight: 600;
        color: #333;
        margin-top: 12px;
        display: block;
      }

      select,
      input,
      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        margin-top: 6px;
        font-size: 15px;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #0057d9;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }

      button:hover {
        background: #003f9e;
      }

      footer {
        text-align: center;
        margin-top: 25px;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1><i class="fa-solid fa-motorcycle"></i> Checklist da Frota</h1>

    <form
      class="app-card"
      method="POST"
      enctype="multipart/form-data"
      action="https://script.google.com/macros/s/AKfycbys4w-kZB8s_azkjVLofLObve0ZEpFXdtxPH9tbKsur7Ujt5VrHUQIdY9Ob-m3CftJU1Q/exec"
    >
      <label><i class="fa-solid fa-user"></i> Motorista:</label>
      <input
        type="text"
        name="driver"
        required
        placeholder="Nome do motorista"
      />

      <label><i class="fa-solid fa-id-card"></i> Veículo:</label>
      <select name="vehicle" id="vehicle" required>
        <option value="">Selecione</option>
        <option>TWY9E66 - Moto Segurança</option>
        <option>TWY9D79 - Moto Segurança</option>
        <option>TWY9E52 - Moto Primeiro Socorros</option>
        <option>FUS8515 - Caminhão Pipa</option>
        <option>TEQ4F23 - AEFA</option>
        <option>TEW0E35 - AEFA</option>
        <option>HEH-7438 - Kombi</option>
        <option>TCE8G67 - Saveiro</option>
        <option>TDP6E56 - Montana</option>
        <option>TCC1F64 - Polo</option>
        <option>TCA1J37 - Montana</option>
        <option>TCA5G73 - Montana</option>
        <option value="Outro">Outro</option>
      </select>

      <input
        id="vehicleOther"
        name="vehicleOther"
        style="display: none; margin-top: 10px"
        placeholder="Digite a placa"
      />

      <div id="firstAidDiv" style="display: none; margin-top: 15px">
        <label
          ><i class="fa-solid fa-kit-medical"></i> Material de Primeiros
          Socorros:</label
        >
        <select name="firstAidStatus">
          <option value="">Selecione</option>
          <option value="Com alteração">Com alteração</option>
          <option value="Sem alteração">Sem alteração</option>
        </select>
      </div>

      <label><i class="fa-solid fa-road"></i> Finalidade:</label>
      <select name="purpose" id="purpose" required>
        <option value="">Selecione</option>
        <option>Início de Rota</option>
        <option>Fim de Rota</option>
        <option>Abastecimento</option>
        <option>Manutenção</option>
        <option>Correspondência</option>
      </select>

      <div id="kmStartDiv">
        <label><i class="fa-solid fa-gauge"></i> KM Inicial:</label>
        <input type="number" name="kmStart" placeholder="Digite o KM inicial" />
      </div>

      <div id="kmEndDiv" style="display: none">
        <label><i class="fa-solid fa-gauge"></i> KM Final:</label>
        <input type="number" name="kmEnd" placeholder="Digite o KM final" />
      </div>

      <label><i class="fa-solid fa-car"></i> Uso do Veículo:</label>
      <select name="usage" required>
        <option value="">Selecione</option>
        <option>Serviço Interno</option>
        <option>Serviço Externo</option>
        <option>Emergência Médica</option>
      </select>

      <label><i class="fa-solid fa-camera"></i> Foto do Painel:</label>
      <input
        type="file"
        name="painelFoto"
        accept="image/*"
        capture="environment"
        required
      />

      <label
        ><i class="fa-solid fa-triangle-exclamation"></i> Possui
        Alteração?</label
      >
      <select id="issueSelect" name="issueSelect" required>
        <option value="">Selecione</option>
        <option>Não</option>
        <option>Sim</option>
      </select>

      <div id="issueDetails" style="display: none">
        <label>Descreva a alteração:</label>
        <textarea name="issueDesc" rows="3"></textarea>

        <label>Foto da Alteração (opcional):</label>
        <input type="file" name="issueFoto" accept="image/*" />
      </div>

      <button type="submit">
        <i class="fa-solid fa-paper-plane"></i> Enviar Checklist
      </button>
    </form>

    <footer>Segurança ARN • Desenvolvido por Edson Garcia</footer>

    <script>
      const vehicle = document.getElementById("vehicle");
      const vehicleOther = document.getElementById("vehicleOther");
      const firstAidDiv = document.getElementById("firstAidDiv");
      const purpose = document.getElementById("purpose");
      const kmStartDiv = document.getElementById("kmStartDiv");
      const kmEndDiv = document.getElementById("kmEndDiv");
      const issueSelect = document.getElementById("issueSelect");
      const issueDetails = document.getElementById("issueDetails");

      vehicle.addEventListener("change", () => {
        vehicleOther.style.display =
          vehicle.value === "Outro" ? "block" : "none";

        if (vehicle.value.includes("Primeiro Socorros")) {
          firstAidDiv.style.display = "block";
        } else {
          firstAidDiv.style.display = "none";
        }
      });

      purpose.addEventListener("change", () => {
        if (purpose.value === "Fim de Rota") {
          kmStartDiv.style.display = "none";
          kmEndDiv.style.display = "block";
        } else {
          kmStartDiv.style.display = "block";
          kmEndDiv.style.display = "none";
        }
      });

      issueSelect.addEventListener("change", () => {
        issueDetails.style.display =
          issueSelect.value === "Sim" ? "block" : "none";
      });
    </script>
  </body>
</html>
